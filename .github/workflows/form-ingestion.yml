
name: BridgeUp Form Ingestion

'on':
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read

concurrency:
  group: bridgeup-form-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    name: Process Google Form responses
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run ingestion worker
        env:
          GOOGLE_SHEET_API_URL: ${{ secrets.GOOGLE_SHEET_API_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python backend/ingestion_worker.py
